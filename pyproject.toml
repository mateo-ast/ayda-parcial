[project]
name = "ayda-parcial"
version = "0.1.0"
description = "Programa con algoritmos sobre un conjunto de datos"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ayda-parcial = "ayda_parcial.main:main"

[dependency-groups]
dev = ["pyinstaller>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ayda_parcial"]
